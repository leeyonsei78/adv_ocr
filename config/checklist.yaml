# ============================================================
# 광고심의점검표 (변액보험 이외 보험) — 자동 1차 점검 정의
# ------------------------------------------------------------
# 점검표 항목(No./점검항목/규정/예시 문구)은 협회 점검표 양식을 그대로 옮겼고,
# 항목별 자동 판정 방법(정규식·적용 조건)은 이 PoC 가 임의로 정한 "예시"입니다.
# 운영 전에 준법감시/심의 담당자가 패턴과 적용 조건을 규정 원문에 맞게 검수하세요.
#
# 판정 기호:  ○ 적합 / × 부적합 / △ 미흡 / - 해당사항 없음 / ? 자동판정 불가(담당자 확인)
#   · 모든 정규식은 "공백을 제거한 텍스트" 에 적용됩니다 (패턴에 공백을 쓰지 마세요).
#   · × 는 "문구를 찾지 못함/금지 표현 검출" 이며 OCR 누락일 수 있어 최종 판단은 담당자의 몫입니다.
#
# type
#   elements  : 요소(elements)별 문구 존재 여부. 모두 있으면 ○, 일부만 있으면 △, 하나도 없으면 ×
#   reuse     : config/rules.yaml 의 필수 문구 룰(REQ-xxx) 결과를 그대로 사용
#   prohibited: 금지표현 룰(BAN-xxx) 검출 결과 + 추가 패턴(patterns) + 점검 결과 범주(categories)
#   visual    : 글자 크기(OCR 글자 높이 / PPT pt) 자동 점검 결과 사용
#   validity  : 광고 유효기간(심의필 기간) 파싱 및 현재 날짜와 비교
#   product_name / company : 상품 마스터와 대조
#   derived   : 다른 항목의 결과에서 파생
#   manual    : 자동 판정 불가 — 담당자 확인
#   na        : 영상(홈쇼핑 등) 전용 항목 — 정지 이미지·PPT 는 해당 없음
# applies: 적용 조건. product_types(상품군) 또는 when_any(문구가 있으면) 중 하나라도 맞으면 적용.
#          상품군이 지정돼 있지 않은데 조건 문구도 없으면 '?'(해당 상품이면 점검) 로 표시.
# ============================================================

settings:
  title: "광고심의점검표 (변액보험 이외 보험)"
  expired_mark: "×"        # 유효기간이 지난 경우

items:
  # -------------------- 1. 경고문구 --------------------
  - num: "1-1"
    group: 경고문구
    title: "해약환급금/만기보험금의 변동가능성"
    basis: "규정 §20-③-1"
    sample: ""
    type: elements
    applies:
      product_types: [savings, annuity, whole_life]
      when_any: ['(해약|해지)환급금', '만기(보험금|환급금)', '공시이율', '금리연동']
    elements:
      - name: "변동 가능성 안내"
        any_of: ['(해약|해지|만기)(환급금|보험금).{0,30}(변동|달라질|변경될)', '(공시이율|이율|금리).{0,20}(변동|달라질|변경)', '(환급금|보험금).{0,12}변동가능']
        fuzzy: ["변동될수"]

  - num: "1-2"
    group: 경고문구
    title: "예시된 해약환급금/보험금 등 수익률이 미래를 보장하지 않음"
    basis: "규정 §20-③-2"
    sample: ""
    type: elements
    applies:
      when_any: ['(해약환급금|해지환급금|만기보험금|환급률|수익률).{0,30}(예시|예상|시뮬레이션)', '(예시|예상|시뮬레이션).{0,30}(해약환급금|해지환급금|만기보험금|환급률|수익률)']
    elements:
      - name: "미래 비보장 안내"
        any_of: ['(미래|향후).{0,25}(보장|보증)하지', '예시.{0,25}(보장|보증)하지', '(보장|보증)하는것은아닙니다']
        fuzzy: ["보장하지않"]

  - num: "1-3"
    group: 경고문구
    title: "갱신형상품 경고문구 표시"
    basis: "규정 §20-②"
    sample: ""
    type: reuse
    rules: [REQ-004]

  - num: "1-4"
    group: 경고문구
    title: "갱신형상품 경고문구 안내방법 준수"
    basis: "규정 §20-④(§21-②)"
    sample: ""
    type: visual
    hint: "글자 크기는 OCR 글자 높이/PPT pt 로 자동 점검합니다. 글자 색상·위치·노출 시간 등은 육안 확인하세요."

  - num: "1-5"
    group: 경고문구
    title: "표시기준 준수"
    basis: "규정 §21의4-①/②"
    sample: ""
    type: manual
    hint: "표시기준(§21의4) 준수 여부는 자동 판정하지 않습니다."

  # -------------------- 2. 필수안내사항 --------------------
  - num: "2-1"
    group: 필수안내사항
    title: "상품설명서 및 약관 참조 안내"
    basis: "규정 §21-①-1"
    sample: "보험가입 전에 본 상품설명서 및 약관을 확인하시기 바랍니다"
    type: reuse
    rules: [REQ-003]

  - num: "2-2"
    group: 필수안내사항
    title: "회사 등의 명칭(보험대리점의 경우 협회 등록번호 포함)"
    basis: "규정 §21-①-2"
    sample: "(보험회사) ○○생명보험 / (법인대리점) ○○보험대리점(○○○○○○)"
    type: company
    company_regex: '(생명보험(?!협회)|손해보험|화재해상보험|라이프|보험대리점|생명(?!보험협회|협회))'
    agency_regex: '보험대리점'
    agency_reg_no: '(등록번호|협회등록).{0,6}\d{4,}|\(\d{6,}\)'

  - num: "2-3"
    group: 필수안내사항
    title: "보험상품의 명칭"
    basis: "규정 §21-①-3"
    sample: "약관상 명칭 사용 (동일성 인정 범위내 명칭 일부 사용가능)"
    type: product_name

  - num: "2-4"
    group: 필수안내사항
    title: "기존계약 해지후 신계약 체결시 불이익 사항"
    basis: "규정 §21-①-4"
    sample: "보험계약자가 기존 보험계약을 해지하고 새로운 보험계약을 체결할 경우 인수거절, 보험료 인상, 보장내용 축소 등 불이익이 생길 수 있습니다."
    type: elements
    elements:
      - name: "기존계약 해지 후 신계약 체결 언급"
        any_of: ['기존.{0,6}계약.{0,12}해지']
        fuzzy: ["기존보험계약을해지"]
      - name: "불이익 내용(인수거절·보험료 인상·보장 축소)"
        any_of: ['(인수거절|보험료.{0,4}인상|보장내용.{0,4}축소|불이익)']
        fuzzy: ["불이익"]

  - num: "2-5"
    group: 필수안내사항
    title: "보험금 지급제한 사유"
    basis: "규정 §21-①-5"
    sample: "<노출하는 보장내용 관련 주요 지급제한사항> 지급횟수, 한도, 보험금 감액지급내용, 보장개시일, 중복가입 시 비례보상에 관한 사항, 약관에서 정한 질병구분, 일반사망보험금의 경우 '고의적사고 및 2년이내 자살 제외' 등"
    type: reuse
    rules: [REQ-006]
    applies:
      when_any: ['\d[\d,]*(천만|백만|만|억)원', '(진단|사망|입원|수술|보장).{0,10}\d']
    not_applicable_note: "보장내용(금액) 노출이 없어 해당 없음으로 처리"

  - num: "2-6"
    group: 필수안내사항
    title: "이자율의 범위/산출기준(저축성보험의 금리연동형상품)"
    basis: "규정 §21-①-6"
    sample: "\"현재 공시이율에서 기준금리에 따라 매월 변동\", \"시장금리를 반영하여 변동 가능\" 등"
    type: elements
    applies:
      product_types: [savings, annuity]
      when_any: ['공시이율', '금리연동']
    elements:
      - name: "이자율 변동·산출기준 안내"
        any_of: ['(공시이율|이율|금리|이자).{0,25}(변동|기준금리|시장금리|반영)']
        fuzzy: ["공시이율"]

  - num: "2-7"
    group: 필수안내사항
    title: "설명의무 고지사항"
    basis: "규정 §21-①-7"
    sample: "○○사 및 모집종사자는 해당 상품에 대해 충분히 설명할 의무가 있으며, 가입자는 가입에 앞서 이에 대한 충분한 설명을 받으시기 바랍니다."
    type: elements
    elements:
      - name: "설명의무 안내"
        any_of: ['충분(한|히)설명.{0,14}(의무|받으시|드리)', '설명(을)?받으시', '설명할의무']
        fuzzy: ["충분히설명", "설명의무"]

  - num: "2-8"
    group: 필수안내사항
    title: "법령/내부통제기준 관련 절차준수 사항"
    basis: "규정 §21-①-8"
    sample: "(협회 심의필번호 또는 회사 준법감시인 심의필로 대체 가능) → 생명보험협회 심의필 제○○호 (20xx.xx.xx. ~ 20xx.xx.xx.)"
    type: reuse
    rules: [REQ-001]

  - num: "2-9"
    group: 필수안내사항
    title: "예금자보호법"
    basis: "규정 §21-①-9"
    sample: "이 보험계약은 예금자보호법에 따라 예금보험공사가 보호하되, 보호한도는 본 보험회사에 있는 귀하의 모든 예금보호대상 금융상품의 해지환급금 (또는 만기시 보험금이나 사고보험금)에 기타지급금을 합하여 1인당 \"최고 5천만원\"이며, 5천만원을 초과하는 나머지 금액은 보호하지 않습니다."
    type: elements
    elements:
      - name: "예금자보호법 언급"
        any_of: ['예금자보호']
        fuzzy: ["예금자보호"]
      - name: "예금보험공사"
        any_of: ['예금보험공사']
        fuzzy: ["예금보험공사"]
      - name: "보호한도 1인당 5천만원"
        any_of: ['(보호|한도|예금).{0,60}(5천만원|5,000만원|5000만원|오천만원)', '(5천만원|5,000만원|5000만원|오천만원).{0,30}(보호|한도)']
      - name: "한도 초과분 비보호"
        any_of: ['(초과|넘는).{0,14}(보호하지|보호되지|보호안)']

  - num: "2-10"
    group: 필수안내사항
    title: "금융상품판매 대리ㆍ중개 업무 수행관련 고지사항"
    basis: "규정 §21-①-10"
    sample: "① “해당 모집종사자는 ○○사와 전속계약을 체결한 보험설계사(보험대리점)입니다.” 또는 “해당 모집종사자는 다수의 보험사와 계약 체결 및 대리·중개하는 보험설계사(보험대리점)입니다.” ② “해당 모집종사자는 보험사로부터 보험계약체결권을 부여받지 아니한 금융상품판매 대리·중개업자임을 알려드립니다.”"
    type: elements
    elements:
      - name: "모집종사자 지위 고지(전속/다수/체결권 없음)"
        any_of: ['전속계약.{0,20}(보험설계사|보험대리점)', '다수의?보험(사|회사).{0,25}(대리|중개)', '보험계약체결권.{0,20}(부여받지|없)', '모집종사자.{0,14}(전속|다수|체결권)']
        fuzzy: ["보험설계사", "전속계약"]

  - num: "2-11"
    group: 필수안내사항
    title: "광고 유효기간"
    basis: "규정 §21-①-11"
    sample: "생명보험협회 심의필 제○○호 (20xx.xx.xx. ~ 20xx.xx.xx.)"
    type: validity

  - num: "2-12"
    group: 필수안내사항
    title: "통계 인용시 해당자료 출처"
    basis: "규정 §21-①-12"
    sample: "①자료명, ②발표기관, ③발표일자 반드시 포함 ※ (서베이자료) 조사대상(성별/인원 등) 추가 표기"
    type: elements
    # 심의필 번호·유효기간의 날짜가 '발표일자'로 오인되지 않도록 먼저 제거
    strip: ['심의필제[^호]{0,20}호', '\d{4}[.\-/]\d{1,2}[.\-/]\d{1,2}\.?[~∼～\-–]\d{4}[.\-/]\d{1,2}[.\-/]\d{1,2}\.?']
    applies:
      when_any: ['(통계|조사|설문|서베이|응답자|연구결과|보고서).{0,30}\d', '\d.{0,20}(통계|설문|응답자)', '(통계청|보험개발원|국립암센터|중앙암등록본부)']
    elements:
      - name: "①자료명"
        any_of: ['(「|『|“)[^”」』]{2,30}(”|」|』)', '(통계|조사결과|보고서|연보|백서|통계표|발간)']
      - name: "②발표기관"
        any_of: ['(통계청|금융감독원|금융위원회|보험개발원|국립암센터|중앙암등록본부|보건복지부)', '[가-힣]{2,10}(협회|연구원|연구소|공단|공사|위원회)']
      - name: "③발표일자"
        any_of: ['(19|20)\d{2}[.\-/년]\d{1,2}']
      - name: "(서베이) 조사대상(성별/인원)"
        when_any: ['설문|서베이|응답자']
        any_of: ['\d[\d,]*명', '(남녀|남성|여성|성인)']

  - num: "2-13"
    group: 필수안내사항
    title: "연계ㆍ제휴서비스 등 관련 충족요건"
    basis: "규정 §21-①-13"
    sample: "(경품 제공조건 등 구체적 명기) → 7일내 상담완료시, 고객당 월 1회한 등"
    type: elements
    applies:
      when_any: ['(제휴|연계)(서비스|혜택|업체)', '(경품|사은품|증정|추첨)', '이벤트']
    ok_mark: "?"
    ok_note: "조건으로 보이는 문구가 있으나 '구체적 명기' 여부는 담당자가 판단하세요."
    elements:
      - name: "제공 조건(기간·횟수·대상 등)"
        any_of: ['(이내|까지|한정|조건|고객당|\d회|월\d|선착순\d|가입시|상담완료)']

  - num: "2-14"
    group: 필수안내사항
    title: "보험료･보험금 관련사항(보험료･보험금 노출 광고)"
    basis: "규정 §21-①-15"
    sample: "(주계약 보장내용) 지급사유 - 보험금액 / (특약 보장내용) 지급사유 - 보험금액 / (보험료) 남녀별로 30세, 40세, 50세(또는 35세, 40세, 45세) 등 세가지 이상 도표로 예시 / (해약환급금) 해약환급금 예시표(1,3,5년은 반드시 포함하되 10년, 15년 등 만기까지 안내), 중도해지시 납입한 보험료보다 적거나 없을 수 있다는 내용"
    type: elements
    applies:
      when_any: ['보험료.{0,8}\d', '월\d[\d,]*원', '(진단|사망|입원|수술|보험금|보장).{0,12}\d[\d,]*(천만|백만|만|억)?원']
    elements:
      - name: "보험금액(지급사유별)"
        any_of: ['(진단|사망|입원|수술|재해|골절|장해|암|보험금).{0,20}\d[\d,]*(천만|백만|만|억)?원']
      - name: "보험료 예시표(3개 연령 이상)"
        when_any: ['보험료.{0,8}\d', '월\d[\d,]*원', '월보험료']
        any_of: ['30세.*40세.*50세', '35세.*40세.*45세']
      - name: "보험료 예시표(남녀별)"
        when_any: ['보험료.{0,8}\d', '월\d[\d,]*원', '월보험료']
        any_of: ['(남자|남성|남).*(여자|여성|여)', '(여자|여성|여).*(남자|남성|남)']
      - name: "해약환급금 예시표(1·3·5년)"
        when_any: ['(해약|해지)환급금']
        any_of: ['1년.*3년.*5년']
      - name: "중도해지 시 환급금이 적거나 없을 수 있음"
        when_any: ['(해약|해지)환급금']
        any_of: ['(중도)?(해지|해약).{0,25}(적거나|없을|원금)', '납입(한)?보험료.{0,10}(보다)?적거나', '환급금.{0,15}(적거나|없을)']
        fuzzy: ["적거나없을"]

